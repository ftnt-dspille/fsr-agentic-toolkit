[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "fsr-agentic-toolkit"
version = "0.1.3"
description = "The agent layer for FortiSOAR: evidence-backed workflows, one gate, one MCP server and CLI, on pyfsr and fsr-playbooks."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
  "pyfsr>=0.28.0",
  "fsr-playbooks>=0.8.0",
  "mcp>=2.0,<3",
  "pydantic>=2",
]

[project.optional-dependencies]
test = ["pytest>=8"]
# Everything a contributor needs: the test runner plus the configured linter.
# ruff is pinned so the lint gate is deterministic across contributors and CI.
dev = ["pytest>=8", "ruff==0.17.2"]

[project.scripts]
fsr-agentic-toolkit = "fsr_agentic_toolkit.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/fsr_agentic_toolkit"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = ["requires_extra(name): needs an optional dependency (mcp is a core dependency here)"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint.per-file-ignores]
# Test stubs declare class-level result shapes (missing/invalid/...) as mutable
# literals; each is instantiated fresh per call, so the shared-mutable-default
# lint (RUF012) does not apply.
"tests/**" = ["RUF012"]
